name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  no-runtime-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Assert zero runtime dependencies
        run: |
          COUNT=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          if [ "$COUNT" != "0" ]; then
            echo "This package promises zero runtime dependencies. Found $COUNT."
            exit 1
          fi
